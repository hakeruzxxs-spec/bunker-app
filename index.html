<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bunker: Omon Qolish</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bunker-container">
        <!-- Yuqori sarlavha -->
        <div class="header-plate">
            <span class="biohazard-icon">☣</span>
            <h1>BUNKER: OMON QOLISH</h1>
        </div>

        <!-- Terminal ekrani -->
        <div class="terminal-screen">
            <div class="terminal-header">Aktiv Sardor: <span id="player-name">[SARDOR]</span></div>
            <hr class="terminal-line">
            <div class="terminal-body">
                <p>Salom, sardor!</p>
                <p>Bunker terminaliga muvaffaqiyatli ulandingiz.</p>
                <p>Tizim xonaga kirishni kutyapti.</p>
                <p>Xonaga kirish uchun tugmani bosing.</p>
            </div>
        </div>

        <!-- Xonaga kirish tugmasi -->
        <div class="button-wrapper">
            <button class="enter-btn" onclick="enterRoom()">
                🎮 XONAGA KIRISH
            </button>
        </div>

        <!-- Pastki navigatsiya menyusi -->
        <div class="bottom-nav">
            <button class="nav-btn" onclick="openTab('shop')">
                <span class="nav-icon">🛒</span>
                <span class="nav-text">Do'kon</span>
            </button>
            <button class="nav-btn" onclick="openTab('profile')">
                <span class="nav-icon">🪖</span>
                <span class="nav-text">Profil</span>
            </button>
            <button class="nav-btn" onclick="openTab('rules')">
                <span class="nav-icon">📑</span>
                <span class="nav-text">Qoidalar</span>
            </button>
            <button class="nav-btn" onclick="openTab('rating')">
                <span class="nav-icon">🏆</span>
                <span class="nav-text">Reyting</span>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
